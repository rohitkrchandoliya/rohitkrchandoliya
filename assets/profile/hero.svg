<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="480" viewBox="0 0 1500 480" role="img" aria-labelledby="title desc">
<title id="title">ROHIT.OS — AI, Automation, Software and Cybersecurity</title>
<desc id="desc">A futuristic developer profile banner featuring Rohit's transparent portrait, neon HUD circles, profile details and terminal card.</desc>
<defs>
 <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#030712"/><stop offset=".48" stop-color="#10152f"/><stop offset="1" stop-color="#061a29"/></linearGradient>
 <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22d3ee"/><stop offset=".52" stop-color="#818cf8"/><stop offset="1" stop-color="#c084fc"/></linearGradient>
 <radialGradient id="glow"><stop stop-color="#0891b2" stop-opacity=".38"/><stop offset="1" stop-color="#0891b2" stop-opacity="0"/></radialGradient>
 <filter id="blur"><feGaussianBlur stdDeviation="24"/></filter>
 <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#67e8f9" stroke-opacity=".08"/></pattern>
 <clipPath id="clip"><rect x="1" y="1" width="1498" height="478" rx="26"/></clipPath>
</defs>
<g clip-path="url(#clip)">
 <rect width="1500" height="480" rx="26" fill="url(#bg)"/><rect width="1500" height="480" fill="url(#grid)"/>
 <circle cx="260" cy="210" r="230" fill="url(#glow)" filter="url(#blur)"/><circle cx="1360" cy="275" r="220" fill="#6d28d9" opacity=".14" filter="url(#blur)"/>
 <path d="M0 390H1500M0 88H1500" stroke="#22d3ee" stroke-opacity=".12"/>
 <rect x="16" y="16" width="1468" height="448" rx="22" fill="none" stroke="url(#neon)" stroke-opacity=".75"/>
 <g fill="#67e8f9" opacity=".75"><circle cx="56" cy="56" r="2"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="1442" cy="412" r="2"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle><circle cx="390" cy="52" r="1.5"><animate attributeName="cy" values="52;62;52" dur="3s" repeatCount="indefinite"/></circle></g>
 <g transform="translate(62 22)">
  <circle cx="174" cy="172" r="148" fill="url(#glow)"/>
  <circle cx="174" cy="172" r="139" fill="none" stroke="url(#neon)" stroke-width="5" opacity=".9"/>
  <circle cx="174" cy="172" r="126" fill="none" stroke="#22d3ee" stroke-width="2" stroke-dasharray="8 10" opacity=".8"><animateTransform attributeName="transform" type="rotate" from="0 174 172" to="360 174 172" dur="32s" repeatCount="indefinite"/></circle>
  <circle cx="174" cy="172" r="113" fill="#061426" stroke="#164e63" stroke-width="2"/>
  <image href="https://github.com/rohitkrchandoliya.png" x="63" y="8" width="222" height="287" preserveAspectRatio="xMidYMid meet"/>
  <path d="M30 102H10V132M318 102H338V132M30 245H10V215M318 245H338V215" fill="none" stroke="#67e8f9" stroke-width="2.5" opacity=".9"/>
  <rect x="30" y="310" width="288" height="42" rx="15" fill="#03101f" stroke="#22d3ee" stroke-width="2"/>
  <text x="174" y="336" fill="#e0faff" font-family="ui-monospace,monospace" font-size="17" font-weight="800" text-anchor="middle" letter-spacing="1">HUMAN IN THE LOOP</text>
  <text x="174" y="371" fill="#cbd5e1" font-family="ui-monospace,monospace" font-size="12" text-anchor="middle">(REVIEW &amp; EXCEPTION HANDLING)</text>
 </g>
 <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace">
  <text x="440" y="72" fill="#67e8f9" font-size="15" letter-spacing="5">[ SYSTEM INITIALIZED ]</text>
  <text x="435" y="145" fill="#f8fafc" font-size="47" font-weight="900">ROHIT KUMAR</text>
  <text x="435" y="199" fill="#f8fafc" font-size="47" font-weight="900">CHANDOLIYA</text>
  <rect x="438" y="218" width="600" height="3" rx="1.5" fill="url(#neon)"><animate attributeName="width" values="100;600;460;600" dur="7s" repeatCount="indefinite"/></rect>
  <text x="440" y="259" fill="#c4b5fd" font-size="20" font-weight="800">FOUNDER @ CHEAKSTAR</text>
  <text x="440" y="295" fill="#cbd5e1" font-size="16">AI SYSTEMS  /  AUTOMATION  /  SOFTWARE</text>
  <text x="440" y="322" fill="#cbd5e1" font-size="16">APPLICATION SECURITY  /  PRODUCT BUILDING</text>
  <g transform="translate(438 350)">
   <rect width="120" height="34" rx="8" fill="#083344" stroke="#0891b2"/><text x="60" y="22" fill="#a5f3fc" font-size="12" text-anchor="middle">DESIGN</text>
   <rect x="132" width="120" height="34" rx="8" fill="#1e1b4b" stroke="#6366f1"/><text x="192" y="22" fill="#ddd6fe" font-size="12" text-anchor="middle">BUILD</text>
   <rect x="264" width="120" height="34" rx="8" fill="#172554" stroke="#2563eb"/><text x="324" y="22" fill="#bfdbfe" font-size="12" text-anchor="middle">SECURE</text>
   <rect x="396" width="120" height="34" rx="8" fill="#052e2b" stroke="#059669"/><text x="456" y="22" fill="#a7f3d0" font-size="12" text-anchor="middle">SHIP</text>
  </g>
  <g transform="translate(1118 96)">
   <rect width="310" height="286" rx="16" fill="#020617" fill-opacity=".9" stroke="#334155" stroke-width="1.5"/>
   <path d="M0 48H310" stroke="#334155"/>
   <circle cx="21" cy="24" r="5" fill="#fb7185"/><circle cx="39" cy="24" r="5" fill="#fbbf24"/><circle cx="57" cy="24" r="5" fill="#34d399"/>
   <text x="77" y="29" fill="#94a3b8" font-size="12">rohit@rohit-os</text>
   <text x="20" y="82" fill="#67e8f9" font-size="15">$ whoami</text>
   <text x="20" y="109" fill="#e2e8f0" font-size="15">founder / builder</text>
   <text x="20" y="146" fill="#67e8f9" font-size="15">$ focus --now</text>
   <text x="20" y="173" fill="#e2e8f0" font-size="15">AI + automation</text>
   <text x="20" y="198" fill="#e2e8f0" font-size="15">software + security</text>
   <text x="20" y="236" fill="#67e8f9" font-size="15">$ status</text>
   <text x="20" y="264" fill="#34d399" font-size="15">● BUILDING <animate attributeName="opacity" values=".4;1;.4" dur="1.7s" repeatCount="indefinite"/></text>
  </g>
 </g>
 <rect x="22" y="22" width="1456" height="2" fill="#67e8f9" opacity=".25"><animate attributeName="y" values="22;455;22" dur="9s" repeatCount="indefinite"/></rect>
</g></svg>