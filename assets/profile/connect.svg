<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="140" viewBox="0 0 1200 140" role="img" aria-labelledby="t d"><title id="t">Let's connect</title><desc id="d">Animated neon footer inviting collaboration on AI, automation, software and cybersecurity.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#020617"/><stop offset=".5" stop-color="#111638"/><stop offset="1" stop-color="#061b2b"/></linearGradient><linearGradient id="n"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#a78bfa"/></linearGradient></defs><rect width="1200" height="140" rx="18" fill="url(#bg)" stroke="#334155"/><path d="M0 10H1200" stroke="url(#n)" stroke-width="3" stroke-dasharray="160 1040"><animate attributeName="stroke-dashoffset" values="1200;0" dur="7s" repeatCount="indefinite"/></path><g font-family="monospace" text-anchor="middle"><text x="600" y="55" fill="#f8fafc" font-size="27" font-weight="700">LET'S BUILD SOMETHING USEFUL.</text><text x="600" y="84" fill="#a5b4fc" font-size="15">AI · AUTOMATION · SOFTWARE · CYBERSECURITY</text><text x="600" y="111" fill="#67e8f9" font-size="13">OPEN TO IDEAS, COLLABORATION &amp; CHALLENGING PROBLEMS</text></g><circle cx="76" cy="70" r="5" fill="#22d3ee"><animate attributeName="opacity" values=".2;1;.2" dur="2s" repeatCount="indefinite"/></circle><circle cx="1124" cy="70" r="5" fill="#a78bfa"><animate attributeName="opacity" values="1;.2;1" dur="2.5s" repeatCount="indefinite"/></circle></svg>