<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="220" viewBox="0 0 1200 220" role="img" aria-labelledby="t d"><title id="t">Rohit developer dashboard</title><desc id="d">A futuristic developer ID with focus areas and build principles, without fabricated live statistics.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080d1b"/><stop offset="1" stop-color="#101a32"/></linearGradient><linearGradient id="edge"><stop stop-color="#22d3ee"/><stop offset="1" stop-color="#8b5cf6"/></linearGradient></defs><rect width="1200" height="220" rx="18" fill="url(#bg)" stroke="#334155"/><rect x="22" y="22" width="355" height="176" rx="13" fill="#020617" stroke="#155e75"/><text x="44" y="52" fill="#67e8f9" font-family="monospace" font-size="13">DEVELOPER IDENTIFICATION</text><text x="44" y="88" fill="#f8fafc" font-family="monospace" font-size="24" font-weight="700">ROHIT.OS</text><text x="44" y="116" fill="#c4b5fd" font-family="monospace" font-size="15">FOUNDER · CHEAKSTAR</text><text x="44" y="145" fill="#94a3b8" font-family="monospace" font-size="13">STATUS: BUILDING</text><rect x="44" y="163" width="285" height="3" rx="2" fill="#1e293b"/><rect x="44" y="163" width="130" height="3" rx="2" fill="url(#edge)"><animate attributeName="width" values="80;285;130" dur="5s" repeatCount="indefinite"/></rect>
